[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mps-core"
version = "0.11.0"
description = "Python sidecar code shared by Vocal Practice Studio and Song Practice Studio: lyrics alignment engine and the yt-dlp freshness check."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "soundfile",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
    "ignore:PySoundFile failed:UserWarning",
]
