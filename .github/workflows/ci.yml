name: Tests

# This repository is consumed by VPS and SPS at a pinned tag, so a change here
# reaches users only after each app bumps its pin and passes its own CI. These
# jobs guard the package itself: types, behaviour, the public surface, and the
# Python <-> TypeScript wire fixtures.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript (type-check + vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Type-check
        run: npx tsc

      - name: Unit, architecture, public-API and wire-fixture tests
        run: npx vitest run --coverage

  python:
    name: Python (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: python/pyproject.toml

      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y libsndfile1

      # torch is deliberately absent: the aligner is exercised through a scripted
      # acoustic model, which is also how the apps' CI runs this code.
      - name: Install
        working-directory: python
        run: pip install pytest -e .

      - name: pytest
        working-directory: python
        run: python -m pytest -q

      - name: Wire fixtures are up to date
        run: git diff --exit-code -- fixtures

  rust:
    name: Rust (cargo test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: cargo test
        working-directory: rust
        run: cargo test --locked

  consumable:
    name: Installs the way the apps install it
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: System packages
        run: sudo apt-get update && sudo apt-get install -y libsndfile1

      - name: Run the consumer smoke test
        run: node scripts/consumer-smoke.mjs
