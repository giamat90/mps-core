[package]
name = "mps-sidecar"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
description = "Starts the Python sidecar and speaks its JSON-lines protocol (shared by VPS and SPS)"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[dev-dependencies]
tempfile = "3"
