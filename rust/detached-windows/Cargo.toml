[package]
name = "mps-detached-windows"
version = "0.1.0"
edition = "2021"
rust-version = "1.77.2"
description = "Detachable panels: a window of their own, remembered position, allowlist (shared by VPS and SPS)"
publish = false

[dependencies]
tauri = "2.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[dev-dependencies]
tempfile = "3"
